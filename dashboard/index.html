<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!--
  This is the Vite source template — src/main.jsx is the real entry
  point. Run `npm run build` in this folder to produce the actual app
  Electron loads (dist/index.html + bundled assets), or `npm run dev`
  for a live-reloading dev server while editing.
-->
<!--
  script-src: 'wasm-unsafe-eval' is for the OCR engine (ocr/runOcr.js),
  which compiles a local WebAssembly module -- no remote code, nothing
  from 'unsafe-eval' proper, just what WASM instantiation itself needs.
  worker-src: tesseract.js and pdf.js each spin up their own Worker from
  a same-origin script (public/tesseract/, public/pdfjs/).
  connect-src: 'self' lets those same local worker/core/language files
  actually be fetched -- the dtaonline.in origin is still the only thing
  reachable for everything else (the real API).
-->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://dtaonline.in; object-src 'none'; base-uri 'none'; form-action 'none';">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f1621">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.png" type="image/png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<title>DTA Digital department</title>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
