name: Build desktop app

on:
  push:
    tags:
      - 'v*.*.*'
  # Trigger a build+publish manually (Actions tab, or the actions_run_trigger tool) --
  # electron-builder creates the git tag and the GitHub Release itself, from the version
  # already in desktop/package.json, so nothing needs to push a tag first.
  workflow_dispatch: {}

permissions:
  contents: write # needed so electron-builder can publish to GitHub Releases

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            desktop/package-lock.json
            dashboard/package-lock.json

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Install dashboard dependencies
        working-directory: dashboard
        run: npm ci

      - name: Build dashboard (React app electron-builder packages)
        working-directory: dashboard
        run: npm run build

      - name: Build and publish
        working-directory: desktop
        run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
