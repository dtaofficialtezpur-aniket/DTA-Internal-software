name: Build sales desktop app

on:
  push:
    branches:
      - claude/ecstatic-rubin-05pt7w # TEMPORARY: lets this branch build before the workflow reaches the default branch
    tags:
      - 'sales-v*.*.*'
  # Trigger a build+publish manually (Actions tab, or the actions_run_trigger tool) --
  # electron-builder creates the git tag and the GitHub Release itself, from the version
  # already in desktop/package.json, so nothing needs to push a tag first.
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to the releases repo (needs RELEASES_REPO_TOKEN). Leave off to just build downloadable installers.'
        type: boolean
        default: false

permissions:
  contents: write # needed so electron-builder can publish to GitHub Releases

jobs:
  build:
    strategy:
      # One at a time, not in parallel. When the release for this tag doesn't
      # exist yet, each electron-builder run that finds no existing release
      # creates its own -- running all 3 platforms at once raced and split
      # the assets across two separate draft releases instead of one. A job
      # running after the first has a real release to find and attach to.
      max-parallel: 1
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            sales-app/desktop/package-lock.json
            sales-app/dashboard/package-lock.json

      - name: Install desktop dependencies
        working-directory: sales-app/desktop
        run: npm ci

      - name: Install dashboard dependencies
        working-directory: sales-app/dashboard
        run: npm ci

      - name: Build dashboard (React app electron-builder packages)
        working-directory: sales-app/dashboard
        run: npm run build

      - name: Build installers
        working-directory: sales-app/desktop
        run: npx electron-builder --publish ${{ (startsWith(github.ref, 'refs/tags/') || inputs.publish) && 'always' || 'never' }}
        env:
          # Publishing goes to a separate repo (DTA-Sales-Releases); the default GITHUB_TOKEN can only
          # write to this repo, so it needs a PAT scoped to that one. Repo secret: RELEASES_REPO_TOKEN.
          GH_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}

      - name: Upload installers (download from the run page)
        uses: actions/upload-artifact@v4
        with:
          name: dta-sales-${{ matrix.os }}
          path: |
            sales-app/desktop/release/*.exe
            sales-app/desktop/release/*.dmg
            sales-app/desktop/release/*.AppImage
          if-no-files-found: error
          retention-days: 30
