<style>
:root{--bg:#F7F8FA;--card:#fff;--ink:#1F2937;--mute:#6B7280;--line:#EEF0F4;--brand:#2F5BEA;--brand2:#2447C4;--brand-ink:#fff;--yel:#EEF1F6;--yel2:#F8F9FB;--bline:#E1E5EC;--s1:#fff;--s2:#fff;--sink:#1F2937;--hov:#F3F5F9;--good:#14864F;--bad:#C93A3A;--warn:#B7791F;--sh:31,41,55;--g1:#F7F8FA;--g2:#F7F8FA;--thc:#374151}
*{box-sizing:border-box}body{margin:0;font:14px/1.45 system-ui,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);display:flex;min-height:100vh}
aside{width:220px;background:var(--side);color:var(--side-ink);padding:18px 12px;position:sticky;top:0;height:100vh;flex-shrink:0}
aside h1{font-size:16px;margin:0 8px 4px;color:#fff}aside small{display:block;margin:0 8px 18px;opacity:.6}
aside button{display:block;width:100%;text-align:left;background:none;border:0;color:inherit;padding:10px 12px;border-radius:8px;font:inherit;cursor:pointer;margin-bottom:2px}
aside button:hover{background:rgba(255,255,255,.07)}aside button.on{background:var(--brand);color:#fff}
main{flex:1;padding:24px;min-width:0}
h2{margin:0 0 4px;font-size:22px}.sub{color:var(--mute);margin-bottom:18px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));margin-bottom:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.kpi .l{color:var(--mute);font-size:12px;text-transform:uppercase;letter-spacing:.04em}.kpi .v{font-size:24px;font-weight:700;margin-top:4px}
.good{color:var(--good)}.bad{color:var(--bad)}.warn{color:var(--warn)}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--mute);font-size:12px;text-transform:uppercase;letter-spacing:.04em}td.r,th.r{text-align:right}
.tw{overflow-x:auto}
.bar{height:10px;border-radius:5px;background:var(--line);overflow:hidden;display:flex}.bar i{display:block;height:100%}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}.row .sp{flex:1}
button.pri,button.sec{font:inherit;padding:8px 14px;border-radius:8px;cursor:pointer;border:1px solid var(--brand)}
button.pri{background:var(--brand);color:var(--brand-ink)}button.sec{background:none;color:var(--brand)}
select,input{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);width:100%}
.row select,.row input{width:auto}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;background:var(--line)}
.pill.paid,.pill.active,.pill.filed{background:rgba(20,134,79,.15);color:var(--good)}.pill.pending,.pill.paused,.pill.due-soon{background:rgba(183,121,31,.18);color:var(--warn)}.pill.overdue{background:rgba(201,58,58,.15);color:var(--bad)}
dialog{border:0;border-radius:14px;padding:20px;background:var(--card);color:var(--ink);width:min(420px,92vw)}dialog::backdrop{background:rgba(0,0,0,.5)}
dialog label{display:block;margin:10px 0 4px;color:var(--mute);font-size:12px}
.two>*{min-width:0}.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:800px){.two{grid-template-columns:1fr}}

function navItems(){

  if(dept=='marketing')return [...base,['clients','Clients'],...books,['--other','More'],['portal','Client Portal']];
  const cats=[['--services',dept=='accounts'?'Accounting & compliance':'Licenses & registrations'],...CATS[dept].map(a=>['cat:'+a,LBL(a)])];
  return [...base,...(dept=='trading'?[['clients','Portfolio clients']]:[]),...books,...cats,['--other','More'],['trash','Deleted'+(deleted.some(x=>x.type==dept)?' ('+deleted.filter(x=>x.type==dept).length+')':'')],['portal','Client Portal']]}
function render(){
  ensureLedgers();
  document.querySelectorAll('#dseg button').forEach(b=>b.classList.toggle('on',b.dataset.d==dept));
  const items=navItems();if(!items.some(i=>i[0]==view))view='dash';
  let nh='',og=false;items.forEach(([k,l])=>{if(k.startsWith('--')){if(og)nh+='</div>';nh+=`<div class="ng ${k.slice(2)}"><div class="nh">${l}</div>`;og=true}else nh+=`<button data-v="${k}" class="${k==view?'on':''}">${l}</button>`});if(og)nh+='</div>';nav.innerHTML=nh;
  const[vk,arg]=view.split(':');
  const gm=document.getElementById('main'),rk=dept+'|'+view;gm.innerHTML=views[vk](arg);
  if(render.k!=rk){render.k=rk;gm.classList.remove('enter');void gm.offsetWidth;gm.classList.add('enter')}
  const al=alerts();bellN.textContent=al.length;bellN.style.display=al.length?'':'none';
  if(vk=='cat'){csr.oninput=()=>{catQ=csr.value;ct.innerHTML=catRows(arg)};cfs.onchange=()=>{catF=cfs.value;ct.innerHTML=catRows(arg)}}
  if(vk=='vch'){curBal();vTot();const f=vs.fr!=null?document.querySelector('.vch tr[data-r="'+vs.fr+'"] .vl'):document.querySelector('#v_acct,.vch .vl');vs.fr=null;if(f)f.focus()}
  if(vk=='daybook'){const f=()=>{dbf={from:dbfrom.value,to:dbto.value,type:dbtype.value};render()};dbfrom.onchange=dbto.onchange=dbtype.onchange=f}
  if(vk=='crm')cq.oninput=()=>{crmQ=cq.value;kb.innerHTML=board()};
  if(vk=='portal')pc.onchange=()=>{portalCid=pc.value;render()};
}
nav.onclick=e=>{const b=e.target.closest('button');if(b){if(view!=b.dataset.v){catQ='';catF=''}view=b.dataset.v;render()}};
function setDept(dp){if(dept!=dp){dept=dp;vs=null;lgId=null;dbf={from:'',to:'',type:''};portalCid=0;catQ='';catF=''}render()}

function newVs(type,keep){const sg=['Payment','Receipt','Contra'].includes(type),b=()=>({s:'Dr',n:'',a:''});

function saveV(){syncV();const t=vs.type,sg=vs.mode=='single',rows=vs.rows.filter(r=>r.n.trim()||+r.a),lines=[];
  const get=n=>{const l=lgByName(n);if(!l)throw new Error('Ledger “'+n+'” not found. Click “+ Ledger” to create it.');return l};
  try{
    if(!vs.date)throw new Error('Enter the voucher date');
    if(!rows.length)throw new Error('Add at least one line');
    rows.forEach(r=>{if(!(+r.a>0))throw new Error('Enter an amount for '+(r.n||'each line'))});
    if(sg){const a=get(vs.acct),tot=sum(rows,r=>+r.a);
      if(t=='Contra')[a,...rows.map(r=>get(r.n))].forEach(l=>{if(!['Cash-in-hand','Bank Accounts'].includes(l.group))throw new Error('Contra is only between Cash and Bank ledgers')});
      if(t=='Receipt'){lines.push({l:a.id,dr:tot,cr:0});rows.forEach(r=>lines.push({l:get(r.n).id,dr:0,cr:+r.a}))}
      else{lines.push({l:a.id,dr:0,cr:tot});rows.forEach(r=>lines.push({l:get(r.n).id,dr:+r.a,cr:0}))}
    }else{
      if(rows.length<2)throw new Error('A voucher needs at least two lines (one Dr and one Cr)');
      rows.forEach(r=>{const l=get(r.n);lines.push({l:l.id,dr:r.s=='Dr'?+r.a:0,cr:r.s=='Cr'?+r.a:0})});
      const dr=sum(lines,x=>x.dr),cr=sum(lines,x=>x.cr);if(Math.abs(dr-cr)>0.005)throw new Error('Debit ₹'+m2(dr)+' and Credit ₹'+m2(cr)+' do not match (difference ₹'+m2(Math.abs(dr-cr))+')');
    }

    <div><label>Client payment</label><select onchange="${fn('payment')}(this.value)">${['Paid','Unpaid'].map(x=>`<option ${x==p.payment?'selected':''}>${x}</option>`).join('')}</select></div></div>
    <div style="margin-top:12px">${pillL(panState(c),p.status)} ${pill(p.payment.toLowerCase())}</div>`
  }else{
    d2.innerHTML=`<h3 style="margin:0">ITR filing — ${esc(c.name)}</h3><div class="sub">ITR is tracked year-wise. Individual / non-audit returns are usually due by <b>31 July</b>, audit cases by <b>31 October</b> — confirm the date for this client.</div>`+[0,1,2,3,4,5].map(k=>Y-k).map(y=>{const f=yearFil(c,y);
      return `<div class="mrow"><b>FY ${y-1}-${String(y).slice(-2)} (AY ${y}-${String(y+1).slice(-2)})</b>
      <div class="rr"><span class="l">ITR filing status</span>${sel(['Filed','Pending','N/A'],f.filed,`(function(v){setYr(${c.id},${y},'filed',v)})`)}${pill(f.filed.toLowerCase().replace('n/a','na'))}</div>
      <div class="rr"><span class="l">Client payment</span>${sel(['Paid','Unpaid'],f.payment,`(function(v){setYr(${c.id},${y},'payment',v)})`)}${pill(f.payment.toLowerCase())}</div></div>`}).join('')}
  dlg2.scrollTop=sc}
function setFil(id,key,f,val){const c=clients.find(x=>x.id==id);c.gstFiling=c.gstFiling||{};c.gstFiling[key]={...monthFil(c,key),...(c.gstFiling[key]||{}),[f]:val};c.lastUpdated=new Date().toISOString();save();render();drawFiling()}
function setTq(id,key,f,val){const c=clients.find(x=>x.id==id),[fy,q]=key.split('-Q').map(Number);c.tdsQtr=c.tdsQtr||{};c.tdsQtr[key]={...qFil(c,fy,q),...(c.tdsQtr[key]||{}),[f]:val};c.lastUpdated=new Date().toISOString();save();render();drawFiling()}
function setTm(id,key,val){const c=clients.find(x=>x.id==id);c.tdsFiling=c.tdsFiling||{};c.tdsFiling[key]={pay:val};c.lastUpdated=new Date().toISOString();save();render();drawFiling()}
function setPan(id,f,val){const c=clients.find(x=>x.id==id);c.panApp={...panInfo(c),...(c.panApp||{}),[f]:val};if(f=='status'&&val=='Delivered'&&!c.panApp.delivered)c.panApp.delivered=today;c.lastUpdated=new Date().toISOString();save();render();drawFiling()}
function setYr(id,y,f,val){const c=clients.find(x=>x.id==id);c.itrFiling=c.itrFiling||{};c.itrFiling[y]={...yearFil(c,y),...(c.itrFiling[y]||{}),[f]:val};c.lastUpdated=new Date().toISOString();save();render();drawFiling()}
function dl(name,obj){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(obj,null,2)],{type:'application/json'}));a.download=name;a.click()}
function exportJson(S){const L=clients.filter(c=>c.type==dept&&c.service==S);if(!L.length){toast('No records to export yet');return}
  dl('DTA-'+dept+'-'+S.replace(/[^A-Za-z0-9]+/g,'-')+'-clients.json',{exportedOn:new Date().toISOString(),department:DN[dept],service:S,count:L.length,records:L});toast('Exported '+L.length+' record'+(L.length>1?'s':'')+' as JSON')}
function backupAll(){dl('DTA-client-data-backup-'+today+'.json',{app:'DTA Client Data Tracker',exportedOn:new Date().toISOString(),clients,leads,deleted,ledgers,vouchers});toast('Full backup downloaded (JSON)')}
function restoreAll(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(!Array.isArray(o.clients)||!Array.isArray(o.ledgers)||!Array.isArray(o.vouchers))throw 0;if(!confirm('Replace all current data with this backup?'))return;clients=o.clients;leads=o.leads||[];deleted=o.deleted||[];ledgers=o.ledgers;vouchers=o.vouchers;nid=Math.max(100,...clients.map(x=>x.id+1),...deleted.map(x=>x.id+1),...leads.map(x=>x.id+1),...ledgers.map(x=>x.id+1),...vouchers.map(x=>x.id+1));vs=null;lgId=null;save();toast('Backup restored');render()}catch(e){toast('That file is not a valid DTA backup')}inp.value=''};r.readAsText(f)}
nid=Math.max(100,...clients.map(x=>x.id+1),...deleted.map(x=>x.id+1),...leads.map(x=>x.id+1),...ledgers.map(x=>x.id+1),...vouchers.map(x=>x.id+1));
if(!ledgers.length)seedBooks();
dpill.textContent=new Date().toLocaleDateString('en-IN',{weekday:'short',day:'2-digit',month:'short',year:'numeric'});
function openClient(c){setDept(c.type);if(c.service&&CATS[c.type]&&CATS[c.type].includes(c.service)){view='cat:'+c.service;catQ=c.name;catF=''}else view='clients';render()}
function gsRun(){const q=gsq.value.trim().toLowerCase();if(q.length<2){gsres.style.display='none';gsres._o=[];return}const out=[];
  clients.forEach(c=>{if([c.name,c.businessName,c.serial,c.phone,c.regNo,c.detail,c.service].join(' ').toLowerCase().includes(q))out.push({k:'Client',t:c.name,s:DN[c.type]+' · '+(c.service?LBL(c.service):'Portfolio client'),f:()=>openClient(c)})});
  leads.forEach(l=>{if((l.name+' '+l.phone).toLowerCase().includes(q))out.push({k:'Lead',t:l.name,s:DN[l.dept]+' · '+l.service+' · '+STAGES.find(x=>x[0]==l.stage)[1],f:()=>{setDept(l.dept);view='crm';crmQ=l.name;render()}})});
  ledgers.forEach(l=>{if(l.name.toLowerCase().includes(q))out.push({k:'Ledger',t:l.name,s:DN[l.dept]+' · '+l.group,f:()=>{setDept(l.dept);view='lgr';lgId=l.id;render()}})});
  const top=out.slice(0,10);gsres._o=top;gsres.innerHTML=top.map((o,i)=>`<div class="gsi" data-i="${i}"><span class="gk">${o.k}</span><span><b>${esc(o.t)}</b><br><small>${esc(o.s)}</small></span></div>`).join('')||'<div class="gsi"><small>No matches</small></div>';gsres.style.display='block'}
function gsGo(o){gsres.style.display='none';gsq.value='';gsq.blur();o.f()}
gsres.onclick=e=>{const el=e.target.closest('.gsi[data-i]');if(el)gsGo(gsres._o[+el.dataset.i])};
gsq.onkeydown=e=>{if(e.key=='Enter'&&gsres._o&&gsres._o[0])gsGo(gsres._o[0]);if(e.key=='Escape'){gsres.style.display='none';gsq.blur()}};
function qaToggle(e){e.stopPropagation();alm.style.display='none';const o=qam.style.display=='block';qam.style.display=o?'none':'block';
  qam.innerHTML=[['+ Voucher','newV()'],['+ Lead',"view='crm';render();addLead()"],['+ Ledger','ledgerForm()'],['+ Client','quickClient()']].map(([l,f])=>`<button onclick="qam.style.display='none';${f}">${l}</button>`).join('')}
function quickClient(){if(dept=='marketing'){addClient('marketing');return}const opts=[...(dept=='trading'?['Portfolio management']:[]),...CATS[dept]];
  openForm(`<h3 style="margin:0">Add client — which service?</h3><label>Service</label><select id="qc1">${opts.map(x=>`<option>${LBL(x)}</option>`).join('')}</select>`,()=>{const S=opts[document.getElementById('qc1').selectedIndex];setTimeout(()=>S=='Portfolio management'?addClient('trading'):accForm(S),60)})}
function alerts(){const A=[];clients.filter(c=>c.type==dept&&c.service&&CATS[dept]&&CATS[dept].includes(c.service)&&accState(c)=='overdue').forEach(c=>A.push({t:c.name,s:LBL(c.service)+' · overdue',f:()=>openClient(c)}));
  leads.filter(l=>l.dept==dept&&['overdue','today'].includes(fu(l))).forEach(l=>A.push({t:l.name,s:'Follow-up '+(fu(l)=='today'?'due today':'overdue')+' · '+l.service,f:()=>{view='crm';render()}}));return A}
function alToggle(e){e.stopPropagation();qam.style.display='none';const o=alm.style.display=='block',A=alerts();alm.style.display=o?'none':'block';alm._o=A;
  alm.innerHTML=A.map((a,i)=>`<div class="gsi" data-i="${i}"><span class="gk">!</span><span><b>${esc(a.t)}</b><br><small>${esc(a.s)}</small></span></div>`).join('')||'<div class="gsi"><small>Nothing needs attention 🎉</small></div>'}
alm.onclick=e=>{const el=e.target.closest('.gsi[data-i]');if(el){alm.style.display='none';alm._o[+el.dataset.i].f()}};
document.addEventListener('click',e=>{if(!e.target.closest('.gsw'))gsres.style.display='none';if(!e.target.closest('.qw'))qam.style.display='none';if(!e.target.closest('.bw'))alm.style.display='none'});
document.addEventListener('mousemove',e=>{const k=e.target.closest?e.target.closest('.kpi'):null;document.querySelectorAll('.kpi').forEach(x=>{if(x!==k){x.style.setProperty('--rx','0deg');x.style.setProperty('--ry','0deg')}});if(!k)return;const r=k.getBoundingClientRect(),px=(e.clientX-r.left)/r.width,py=(e.clientY-r.top)/r.height;k.style.setProperty('--ry',((px-.5)*10)+'deg');k.style.setProperty('--rx',((.5-py)*8)+'deg');k.style.setProperty('--mx',px*100+'%');k.style.setProperty('--my',py*100+'%')});
document.addEventListener('keydown',e=>{if(e.key=='/'&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)&&!dlg.open&&!dlg2.open){e.preventDefault();gsq.focus()}});
document.addEventListener('keydown',e=>{
  if(view!='vch'||dlg.open)return;
  const m={F4:'Contra',F5:'Payment',F6:'Receipt',F7:'Journal',F8:'Sales',F9:'Purchase'}[e.key];
  if(m){e.preventDefault();setVt(m);return}
  if(e.key=='Enter'&&(e.ctrlKey||e.metaKey)){e.preventDefault();saveV();return}
  if(e.key=='Enter'&&e.target.matches('.vch input,.vch select')){const el=[...document.querySelectorAll('.vch input,.vch select,.vch textarea,#v_save')],i=el.indexOf(e.target);setTimeout(()=>{const n=el[i+1];if(n)n.focus()},0)}
});
render();
</script>
