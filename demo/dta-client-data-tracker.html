<html lang="en">
<head>

<title>DTA Client Data Tracker</title>
<style>
:root{--bg:#f4f6fa;--card:#fff;--ink:#1b2333;--mute:#6b7487;--line:#e3e7ef;--brand:#2f5bea;--brand-ink:#fff;--good:#14864f;--bad:#c93a3a;--warn:#b7791f;--side:#111a2e;--side-ink:#c9d2e6}

aside button{display:block;width:100%;text-align:left;background:none;border:0;color:inherit;padding:10px 12px;border-radius:8px;font:inherit;cursor:pointer;margin-bottom:2px}
aside button:hover{background:rgba(255,255,255,.07)}aside button.on{background:var(--brand);color:#fff}
main{flex:1;padding:24px;min-width:0}
h2{margin:0 0 4px;font-size:22px}.sub{color:var(--mute);margin-bottom:18px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));margin-bottom:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.kpi .l{color:var(--mute);font-size:12px;text-transform:uppercase;letter-spacing:.04em}.kpi .v{font-size:24px;font-weight:700;margin-top:4px}
.good{color:var(--good)}.bad{color:var(--bad)}.warn{color:var(--warn)}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--mute);font-size:12px;text-transform:uppercase;letter-spacing:.04em}td.r,th.r{text-align:right}
.tw{overflow-x:auto}
.bar{height:10px;border-radius:5px;background:var(--line);overflow:hidden;display:flex}.bar i{display:block;height:100%}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}.row .sp{flex:1}
button.pri,button.sec{font:inherit;padding:8px 14px;border-radius:8px;cursor:pointer;border:1px solid var(--brand)}
button.pri{background:var(--brand);color:var(--brand-ink)}button.sec{background:none;color:var(--brand)}
select,input{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);width:100%}
.row select,.row input{width:auto}

dialog{border:0;border-radius:14px;padding:20px;background:var(--card);color:var(--ink);width:min(420px,92vw)}dialog::backdrop{background:rgba(0,0,0,.5)}
dialog label{display:block;margin:10px 0 4px;color:var(--mute);font-size:12px}

.note{background:rgba(47,91,234,.1);border:1px dashed var(--brand);border-radius:10px;padding:10px 14px;margin-bottom:16px;color:var(--ink)}

.item b:last-child{white-space:nowrap}.item{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.top{display:flex;align-items:center;gap:10px;margin:-8px 0 14px}.top .sp{flex:1}.top label{color:var(--mute);font-size:12px;text-transform:uppercase;letter-spacing:.04em}.top select{width:auto;min-width:200px;font-weight:600}

.kan{display:grid;grid-template-columns:repeat(5,minmax(200px,1fr));gap:10px;overflow-x:auto;padding-bottom:8px}
.kcol{background:var(--line);background:color-mix(in srgb,var(--line) 45%,transparent);border-radius:10px;padding:8px;min-height:140px}
.kh{display:flex;justify-content:space-between;align-items:baseline;gap:6px;margin-bottom:8px}.kh .sub,.lead .sub{margin:0}
.lead{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:8px;cursor:pointer}.lead:hover{border-color:var(--brand)}
.pill.today{background:rgba(47,91,234,.15);color:var(--brand)}.pill.upcoming{background:var(--line);color:var(--mute)}
.notes{max-height:150px;overflow:auto;margin-top:8px}.notes div{padding:6px 0;border-top:1px solid var(--line)}
dialog{width:min(560px,94vw);max-height:92vh;overflow:auto}#dlg2{width:min(760px,95vw)}

td.pw{cursor:pointer;letter-spacing:.1em}#ct table{font-size:12.5px}#ct th,#ct td{padding:7px 5px}.st{padding:4px 6px;font-size:12px;font-weight:600;width:auto}
.ic{background:none;border:0;cursor:pointer;color:var(--mute);font-size:15px;padding:2px 6px}.ic:hover{color:var(--brand)}
.mrow{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}.mrow b{display:block;margin-bottom:6px}
.rr{display:flex;align-items:center;gap:8px;margin:4px 0}.rr span.l{flex:1}.rr select{width:auto}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:99}
aside{overflow:auto}.nh{font-size:11px;text-transform:uppercase;letter-spacing:.06em;opacity:.5;margin:12px 12px 4px}
</style>

function navItems(){
  const base=[['dash','Dashboard'],['crm','CRM / Leads'],['ledger','Income & Expenses']];
  if(dept=='marketing')return [...base,['clients','Clients'],['portal','Client Portal']];
  const cats=[['--services',dept=='accounts'?'Accounting & compliance':'Licenses & registrations'],...CATS[dept].map(a=>['cat:'+a,LBL(a)])];
  return [...base,...(dept=='trading'?[['clients','Portfolio clients']]:[]),...cats,['--other','More'],['trash','Deleted'+(deleted.some(x=>x.type==dept)?' ('+deleted.filter(x=>x.type==dept).length+')':'')],['portal','Client Portal']]}
function render(){
  const items=navItems();if(!items.some(i=>i[0]==view))view='dash';
  nav.innerHTML=items.map(([k,l])=>k.startsWith('--')?`<div class="nh">${l}</div>`:`<button data-v="${k}" class="${k==view?'on':''}">${l}</button>`).join('');
  const[vk,arg]=view.split(':');
  document.getElementById('main').innerHTML=views[vk](arg);
  if(vk=='cat'){csr.oninput=()=>{catQ=csr.value;ct.innerHTML=catRows(arg)};cfs.onchange=()=>{catF=cfs.value;ct.innerHTML=catRows(arg)}}
  if(vk=='crm')cq.oninput=()=>{crmQ=cq.value;kb.innerHTML=board()};
  if(vk=='portal')pc.onchange=()=>{portalCid=pc.value;render()};
}
nav.onclick=e=>{const b=e.target.closest('button');if(b){if(view!=b.dataset.v){catQ='';catF=''}view=b.dataset.v;render()}};
dsel.onchange=()=>{dept=dsel.value;portalCid=0;catQ='';catF='';render()};

 <label>Date</label><input id="f6" type="date" value="${today}"><label>Status</label><select id="f7"><option>paid</option><option>pending</option><option>overdue</option></select>`,
 ()=>{tx.push({id:nid++,type:v('f1'),seg:v('f2'),cid:v('f3')?+v('f3'):null,desc:v('f4')||'(no description)',amt:+v('f5')||0,date:v('f6'),status:v('f7')});save();render()})}
function addClient(type){const m=type=='marketing';openForm(`<h3 style="margin:0">Add ${DN[type]} client</h3><label>Name</label><input id="f1">${m?
 `<label>Service</label><input id="f2"><label>Monthly fee (₹)</label><input id="f3" type="number">`:
 `<label>Capital (₹)</label><input id="f2" type="number"><label>DTA profit share %</label><input id="f3" type="number" value="30"><label>This month P&amp;L (₹)</label><input id="f4" type="number" value="0">`}`,
 ()=>{const c={id:nid++,type,name:v('f1')||'New client',status:'active'};
  if(m)Object.assign(c,{service:v('f2')||'—',fee:+v('f3')||0,due:d(30)});else Object.assign(c,{capital:+v('f2')||0,share:+v('f3')||0,pnl:+v('f4')||0});
  clients.push(c);save();render()})}
function setStage(l,k){l.stage=k;if(k=='won'&&!l.wonOn)l.wonOn=today;if(k=='won'||k=='lost')l.next=''}
function dropLead(e,k){e.preventDefault();const l=leads.find(x=>x.id==e.dataTransfer.getData('text'));if(l){setStage(l,k);save();render()}}
function addLead(){openForm(`<h3 style="margin:0">Add lead · ${DN[dept]}</h3><label>Name</label><input id="a1"><label>Phone</label><input id="a2">
 <label>Source</label><select id="a3">${SRC.map(x=>`<option>${x}</option>`).join('')}</select>
 <label>Service wanted</label><select id="a4">${SVC[dept].map(x=>`<option>${x}</option>`).join('')}</select>
 <label>${dept=='trading'?'Expected capital (₹)':'Expected fee (₹)'}</label><input id="a5" type="number">
 <label>Next follow-up</label><input id="a6" type="date" value="${d(2)}"><label>Note</label><input id="a7">`,
 ()=>{const n=v('a7');leads.push({id:nid++,dept,name:v('a1')||'New lead',phone:v('a2'),source:v('a3'),service:v('a4'),value:+v('a5')||0,stage:'new',next:v('a6'),notes:n?[{d:today,t:n}]:[],cid:null});save();render()})}
function leadOpen(id){const l=leads.find(x=>x.id==id);openForm(`<h3 style="margin:0">${l.name}</h3><div class="sub" style="margin:0">${l.phone} · ${l.service} · ${inr(l.value)} · ${l.source}</div>
 <label>Stage</label><select id="l1">${STAGES.map(([k,n])=>`<option value="${k}" ${k==l.stage?'selected':''}>${n}</option>`).join('')}</select>
 <label>Next follow-up</label><input id="l2" type="date" value="${l.next||''}"><label>Add note</label><input id="l3" placeholder="What happened on this call / message?">
 <div class="notes">${[...l.notes].reverse().map(n=>`<div><span class="sub">${n.d}</span> ${n.t}</div>`).join('')||'<div class="sub">No notes yet</div>'}</div>
 <div style="margin-top:12px">${l.cid?`<span class="pill paid">✓ Converted to client: ${cname(l.cid)}</span>`:`<button type="button" class="sec" onclick="convertLead(${l.id})">Convert to client</button>`}</div>`,
 ()=>{setStage(l,v('l1'));if(v('l1')=='new'||v('l1')=='contacted'||v('l1')=='proposal')l.next=v('l2');const n=v('l3');if(n)l.notes.push({d:today,t:n});save();render()})}
function convertLead(id){const l=leads.find(x=>x.id==id),c={id:nid++,type:l.dept,name:l.name};
  if(CATS[l.dept]&&CATS[l.dept].includes(l.service))Object.assign(c,{serial:genSerial(l.service),service:l.service,businessName:'',detail:'',dateGiven:today,loginId:'',password:'',status:'Active',dueDate:'',phone:l.phone,email:'',notes:'Converted from lead',lastUpdated:new Date().toISOString()});
  else if(l.dept=='marketing')Object.assign(c,{service:l.service,fee:l.value,due:d(30),status:'active'});
  else Object.assign(c,{capital:l.value,share:30,pnl:0});
  if(!c.service||c.type=='marketing')c.status='active';clients.push(c);l.cid=c.id;setStage(l,'won');l.notes.push({d:today,t:'Converted to client'});save();dlg.close();render()}
function toggle(id){const c=clients.find(x=>x.id==id);c.status=c.status=='active'?'paused':'active';save();render()}
function setPay(id,val){const c=clients.find(x=>x.id==id);c.pay=val;c.lastUpdated=new Date().toISOString();save();render()}
function setSt(id,val){const c=clients.find(x=>x.id==id);c.status=val;c.lastUpdated=new Date().toISOString();save();render()}
async function pwShow(td,id){const c=clients.find(x=>x.id==id);if(td.dataset.on=='1'){td.dataset.on='0';td.textContent='••••••••';return}td.dataset.on='1';td.textContent=c.password||'—';if(c.password&&await copy(c.password))toast('Password copied')}
async function portalGo(id){const c=clients.find(x=>x.id==id),ok=await copy(c.loginId||'');toast(ok?'Login ID copied — opening the '+c.service+' portal':'Login ID: '+(c.loginId||'—'));window.open(PORTAL[c.service],'_blank')}
function delAcc(id){if(!confirm('Delete this client record? It will be moved to Deleted, not erased.'))return;const i=clients.findIndex(x=>x.id==id),[c]=clients.splice(i,1);c.deletedAt=new Date().toISOString();deleted.push(c);save();toast('Moved to Deleted');render()}
function restoreAcc(i){const[c]=deleted.splice(i,1);delete c.deletedAt;clients.push(c);save();toast('Client restored');render()}
function purgeAcc(i){if(!confirm('Delete forever? This cannot be undone.'))return;deleted.splice(i,1);save();render()}
function accForm(S,id){const c=id?clients.find(x=>x.id==id):{},o=(x)=>esc(c[x]);
  openForm(`<h3 style="margin:0">${id?'Edit':'Add'} ${LBL(S)} client</h3><div class="fg">
  <div><label>Serial No.</label><input id="q1" value="${esc(c.serial||genSerial(S))}"></div><div><label>Client name</label><input id="q2" value="${o('name')}"></div>
  <div><label>Business name</label><input id="q3" value="${o('businessName')}"></div><div><label>Detail (sub-type)</label><input id="q4" value="${o('detail')}"></div>
  <div><label>Date given</label><input id="q5" type="date" value="${c.dateGiven||today}"></div><div><label>Due / renewal date</label><input id="q9" type="date" value="${c.dueDate||''}"></div>
  <div><label>Reg. / License no.</label><input id="q13" value="${o('regNo')}"></div><div><label>Login ID</label><input id="q6" value="${o('loginId')}"></div><div><label>Password</label><input id="q7" value="${o('password')}"></div>
  <div><label>Status</label><select id="q8">${['Active','Pending','Completed','On Hold'].map(x=>`<option ${x==(c.status||'Active')?'selected':''}>${x}</option>`).join('')}</select></div><div><label>Phone</label><input id="q10" value="${o('phone')}"></div>
  <div><label>Email</label><input id="q11" value="${o('email')}"></div><div><label>Notes</label><input id="q12" value="${o('notes')}"></div></div>`,
  ()=>{const r={serial:v('q1')||genSerial(S),name:v('q2')||'New client',businessName:v('q3'),detail:v('q4'),dateGiven:v('q5'),dueDate:v('q9'),regNo:v('q13'),loginId:v('q6'),password:v('q7'),status:v('q8'),phone:v('q10'),email:v('q11'),notes:v('q12'),lastUpdated:new Date().toISOString()};
   if(id)Object.assign(c,r);else clients.push({id:nid++,type:dept,service:S,...r});save();toast(id?'Client updated':'Client saved');render()})}
function filingModal(id){fid=id;fyear=clients.find(x=>x.id==id).service=='TDS'?FY0:Y;drawFiling();if(!dlg2.open)dlg2.showModal()}
function drawFiling(){const c=clients.find(x=>x.id==fid),sc=dlg2.scrollTop;
  const sel=(opts,val,fn)=>`<select onchange="${fn}(this.value)">${opts.map(x=>`<option ${x==val?'selected':''}>${x}</option>`).join('')}</select>`;
  if(c.service=='GST'){
    d2.innerHTML=`<h3 style="margin:0">GST filing — ${esc(c.name)}</h3><div class="sub">GSTR-1 (Sales) is due on the <b>11th</b> and GSTR-3B (Purchase) on the <b>20th</b> of each month. Anything left Pending after its due date shows Overdue automatically.</div>
    <div class="row"><button class="sec" onclick="fyear--;drawFiling()">‹</button><b>${fyear}</b><button class="sec" onclick="fyear++;drawFiling()">›</button></div>`+MN.map((n,i)=>{const key=fyear+'-'+String(i+1).padStart(2,'0'),f=monthFil(c,key);
      return `<div class="mrow"><b>${n} ${fyear}</b>${[['gstr1','GSTR-1 (Sales)',11],['gstr3b','GSTR-3B (Purchase)',20]].map(([k,l,dd])=>`<div class="rr"><span class="l">${l} <span class="sub" style="margin:0">due ${dd}th</span></span>${sel(['Filed','Pending','N/A'],f[k],`(function(v){setFil(${c.id},'${key}','${k}',v)})`)}${pill(retSt(f[k],fyear,i,dd))}</div>`).join('')}
      <div class="rr"><span class="l">Client payment</span>${sel(['Paid','Unpaid'],f.payment,`(function(v){setFil(${c.id},'${key}','payment',v)})`)}${pill(f.payment.toLowerCase())}</div></div>`}).join('')
  }else if(c.service=='TDS'){
    const fyl=`FY ${fyear}-${String(fyear+1).slice(-2)}`;
    d2.innerHTML=`<h3 style="margin:0">TDS filing — ${esc(c.name)}</h3><div class="sub">TDS deducted must be deposited (challan) by the <b>7th</b> of the next month. Quarterly returns (${esc(c.detail)||'24Q / 26Q'}) are due <b>31 Jul, 31 Oct, 31 Jan and 31 May</b>. Anything left Pending after its due date shows Overdue.</div>
    <div class="row"><button class="sec" onclick="fyear--;drawFiling()">‹</button><b>${fyl}</b><button class="sec" onclick="fyear++;drawFiling()">›</button></div><b>Quarterly TDS returns</b><div style="height:6px"></div>`+[1,2,3,4].map(q=>{const f=qFil(c,fyear,q),u=qDue(fyear,q);
      return `<div class="mrow"><b>${qLabel(fyear,q)}</b><div class="rr"><span class="l">TDS return <span class="sub" style="margin:0">due ${u[2]} ${MN[u[1]].slice(0,3)} ${u[0]}</span></span>${sel(['Filed','Pending','N/A'],f.ret,`(function(v){setTq(${c.id},'${fyear}-Q${q}','ret',v)})`)}${pill(tdsQSt(c,fyear,q))}</div>
      <div class="rr"><span class="l">Client payment</span>${sel(['Paid','Unpaid'],f.fee,`(function(v){setTq(${c.id},'${fyear}-Q${q}','fee',v)})`)}${pill(f.fee.toLowerCase())}</div></div>`}).join('')+
    `<div style="height:8px"></div><b>Monthly TDS payment (challan)</b><div style="height:6px"></div>`+fyMonths(fyear).map(m=>{const v=tdsMon(c,m.key).pay,nm=MN[(m.mi+1)%12].slice(0,3);
      return `<div class="mrow"><div class="rr"><span class="l"><span style="font-weight:700">${MN[m.mi]} ${m.y}</span> <span class="sub" style="margin:0">deposit due 7 ${nm}</span></span>${sel(['Paid','Pending','N/A'],v,`(function(x){setTm(${c.id},'${m.key}',x)})`)}${pill(tdsMonSt(c,m.key))}</div></div>`}).join('')
  }else if(c.service=='PAN'){
    const p=panInfo(c),fn=f=>`(function(v){setPan(${c.id},'${f}',v)})`,inp=(f,t)=>`<input type="${t}" value="${esc(p[f])}" onchange="${fn(f)}(this.value)">`;
    d2.innerHTML=`<h3 style="margin:0">PAN application — ${esc(c.name)}</h3><div class="sub">Track the application from start to delivery.</div><div class="fg">
    <div><label>Application type</label><select onchange="${fn('type')}(this.value)">${['New PAN','Correction','Reprint','Aadhaar link','Other'].map(x=>`<option ${x==p.type?'selected':''}>${x}</option>`).join('')}</select></div>
    <div><label>Acknowledgement no.</label>${inp('ack','text')}</div>
    <div><label>Applied on</label>${inp('applied','date')}</div>
    <div><label>Application status</label><select onchange="${fn('status')}(this.value)">${PAN_ST.map(x=>`<option ${x==p.status?'selected':''}>${x}</option>`).join('')}</select></div>
    <div><label>Delivered on</label>${inp('delivered','date')}</div>
    <div><label>Client payment</label><select onchange="${fn('payment')}(this.value)">${['Paid','Unpaid'].map(x=>`<option ${x==p.payment?'selected':''}>${x}</option>`).join('')}</select></div></div>
    <div style="margin-top:12px">${pillL(panState(c),p.status)} ${pill(p.payment.toLowerCase())}</div>`
  }else{
    d2.innerHTML=`<h3 style="margin:0">ITR filing — ${esc(c.name)}</h3><div class="sub">ITR is tracked year-wise. Individual / non-audit returns are usually due by <b>31 July</b>, audit cases by <b>31 October</b> — confirm the date for this client.</div>`+[0,1,2,3,4,5].map(k=>Y-k).map(y=>{const f=yearFil(c,y);
      return `<div class="mrow"><b>FY ${y-1}-${String(y).slice(-2)} (AY ${y}-${String(y+1).slice(-2)})</b>
      <div class="rr"><span class="l">ITR filing status</span>${sel(['Filed','Pending','N/A'],f.filed,`(function(v){setYr(${c.id},${y},'filed',v)})`)}${pill(f.filed.toLowerCase().replace('n/a','na'))}</div>
      <div class="rr"><span class="l">Client payment</span>${sel(['Paid','Unpaid'],f.payment,`(function(v){setYr(${c.id},${y},'payment',v)})`)}${pill(f.payment.toLowerCase())}</div></div>`}).join('')}
  dlg2.scrollTop=sc}
function setFil(id,key,f,val){const c=clients.find(x=>x.id==id);c.gstFiling=c.gstFiling||{};c.gstFiling[key]={...monthFil(c,key),...(c.gstFiling[key]||{}),[f]:val};c.lastUpdated=new Date().toISOString();save();render();drawFiling()}
function setTq(id,key,f,val){const c=clients.find(x=>x.id==id),[fy,q]=key.split('-Q').map(Number);c.tdsQtr=c.tdsQtr||{};c.tdsQtr[key]={...qFil(c,fy,q),...(c.tdsQtr[key]||{}),[f]:val};c.lastUpdated=new Date().toISOString();save();render();drawFiling()}
function setTm(id,key,val){const c=clients.find(x=>x.id==id);c.tdsFiling=c.tdsFiling||{};c.tdsFiling[key]={pay:val};c.lastUpdated=new Date().toISOString();save();render();drawFiling()}
function setPan(id,f,val){const c=clients.find(x=>x.id==id);c.panApp={...panInfo(c),...(c.panApp||{}),[f]:val};if(f=='status'&&val=='Delivered'&&!c.panApp.delivered)c.panApp.delivered=today;c.lastUpdated=new Date().toISOString();save();render();drawFiling()}
function setYr(id,y,f,val){const c=clients.find(x=>x.id==id);c.itrFiling=c.itrFiling||{};c.itrFiling[y]={...yearFil(c,y),...(c.itrFiling[y]||{}),[f]:val};c.lastUpdated=new Date().toISOString();save();render();drawFiling()}
function exportCsv(S){const L=clients.filter(c=>c.type==dept&&c.service==S);if(!L.length){toast('No records to export yet');return}
  const H=['S.No.','Client Name','Business Name','Detail','Date Given','Login ID','Password','Status','Due Date','Phone','Email','Notes','Reg. / License No.','Payment','Last Updated'];
  if(S=='GST')MN.forEach(n=>H.push(n.slice(0,3)+' '+Y+' (GSTR-1 / GSTR-3B / Payment)'));
  if(S=='TDS'){[1,2,3,4].forEach(q=>H.push('Q'+q+' '+FY0+'-'+String(FY0+1).slice(-2)+' (Return / Payment)'));fyMonths(FY0).forEach(m=>H.push(MN[m.mi].slice(0,3)+' '+m.y+' (Challan)'))}
  if(S=='PAN')H.push('Application Type','Ack No.','Applied On','Application Status','Delivered On','Payment');
  if(S=='ITR')[5,4,3,2,1,0].forEach(k=>H.push('FY '+(Y-k-1)+'-'+String(Y-k).slice(-2)+' (Filed / Payment)'));
  const rows=L.map(c=>{const r=[c.serial,c.name,c.businessName,c.detail,c.dateGiven,c.loginId,c.password,c.status,c.dueDate,c.phone,c.email,c.notes,c.regNo,c.pay||'',c.lastUpdated];
    if(S=='GST')MN.forEach((n,i)=>{const f=monthFil(c,Y+'-'+String(i+1).padStart(2,'0'));r.push(f.gstr1+' / '+f.gstr3b+' / '+f.payment)});
    if(S=='TDS'){[1,2,3,4].forEach(q=>{const f=qFil(c,FY0,q);r.push(f.ret+' / '+f.fee)});fyMonths(FY0).forEach(m=>r.push(tdsMon(c,m.key).pay))}
    if(S=='PAN'){const p=panInfo(c);r.push(p.type,p.ack,p.applied,p.status,p.delivered,p.payment)}
    if(S=='ITR')[5,4,3,2,1,0].forEach(k=>{const f=yearFil(c,Y-k);r.push(f.filed+' / '+f.payment)});return r});
  const csv='\ufeff'+[H,...rows].map(r=>r.map(x=>'"'+String(x==null?'':x).replace(/"/g,'""')+'"').join(',')).join('\r\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='DTA-'+S.replace(' ','-')+'-clients.csv';a.click();toast('Exported — opens in Excel')}
nid=Math.max(100,...clients.map(x=>x.id+1),...deleted.map(x=>x.id+1),...tx.map(x=>x.id+1),...leads.map(x=>x.id+1));
render();
</script>
</body>
</html>
